<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chiroro</title>
  <meta name="description" content="记录 · 思考 · 折腾">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="/home/avatar.png">
  <link rel="preload" as="image" href="/home/bg/bg1.webp">
  <link rel="stylesheet" href="/home/landing.css">
</head>
<body>

  <!-- 背景层：两层交替淡入，实现自动切换 -->
  <div class="bg" aria-hidden="true">
    <div class="bg-layer is-active" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <div class="bg-veil"></div>
  </div>

  <main class="stage">

    <section class="hero">
      <div class="avatar">
        <img src="/home/avatar.png" alt="Chiroro 的头像" width="132" height="132">
      </div>
      <h1 class="brand">Chiroro</h1>
      <p class="tagline">记录 · 思考 · 折腾</p>

      <ul class="socials">
        <li>
          <a href="https://github.com/chistxiao" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.19a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.06.78 2.14 0 1.55-.02 2.79-.02 3.17 0 .31.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
          </a>
        </li>
        <li>
          <a href="mailto:chistxiao@users.noreply.github.com" aria-label="邮箱" title="邮箱">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
          </a>
        </li>
        <li>
          <a href="/blog/" aria-label="博客文章" title="博客文章">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5h9a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3z"/><path d="M16 7.5h1.5a2.5 2.5 0 0 1 2.5 2.5v9.5"/><path d="M7.5 8.5h5M7.5 12h5"/></svg>
          </a>
        </li>
      </ul>
    </section>

    <section class="panels">

      <article class="card quote" aria-label="随机一言">
        <span class="quote-glyph" aria-hidden="true">“</span>
        <p class="quote-text" id="quoteText">加载中…</p>
        <p class="quote-from" id="quoteFrom"></p>
      </article>

      <article class="card clock-card" aria-label="时间与天气">
        <p class="date" id="date">—</p>
        <p class="clock" id="clock">--:--:--</p>
        <p class="weather" id="weather"></p>
      </article>

      <nav class="links" aria-label="快捷入口">
        <a class="link-card" href="/blog/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h11a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M8.5 8.5h6M8.5 12h6"/></svg>
          <span>文章</span>
        </a>
        <a class="link-card" href="/archives/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.5"/><path d="M5 9v9.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M10 13h4"/></svg>
          <span>归档</span>
        </a>
        <a class="link-card" href="/tags/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.3 13 20.8a2 2 0 0 1-2.8 0l-7-7A2 2 0 0 1 2.6 12V4.6a2 2 0 0 1 2-2H12a2 2 0 0 1 1.4.6l7.1 7.1a2 2 0 0 1 0 2.9z"/><circle cx="7.6" cy="7.6" r="1.4"/></svg>
          <span>标签</span>
        </a>
        <a class="link-card" href="/about/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
          <span>关于</span>
        </a>
      </nav>

    </section>
  </main>

  <button class="shuffle" id="shuffle" type="button" aria-label="换一张背景图">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5 20 7l-3.5 3.5"/><path d="M20 7H8.5A4.5 4.5 0 0 0 4 11.5"/><path d="M7.5 20.5 4 17l3.5-3.5"/><path d="M4 17h11.5A4.5 4.5 0 0 0 20 12.5"/></svg>
    <span>换一张</span>
  </button>

  <footer class="foot">© 2026 Chiroro · Powered by Hexo &amp; Fluid</footer>

  <script src="/home/landing.js" defer></script>
</body>
</html>
