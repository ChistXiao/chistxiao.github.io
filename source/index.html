<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChistXiao</title>
  <meta name="description" content="ChistXiao 的个人主页">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="/home/avatar.png">
  <link rel="stylesheet" href="/home/landing.css">
</head>
<body>

  <!-- 背景层：两层交替淡入；随鼠标轻微位移 -->
  <div class="bg" aria-hidden="true">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <div class="bg-veil"></div>
  </div>

  <div class="greet" id="greet" role="status" aria-live="polite">
    <span class="greet-icon" aria-hidden="true">i</span>
    <span class="greet-text"><b id="greetWord">凌晨好</b> 欢迎来到我的主页</span>
  </div>

  <main class="stage">

    <section class="hero">
      <button class="avatar" id="avatar" type="button" aria-expanded="false" aria-controls="note" aria-label="展开简介">
        <img src="/home/avatar.png" alt="ChistXiao">
      </button>

      <h1 class="brand">ChistXiao</h1>

      <ul class="socials">
        <li>
          <a href="https://github.com/chistxiao" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
            <svg class="icon-solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.19a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.06.78 2.14 0 1.55-.02 2.79-.02 3.17 0 .31.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
          </a>
        </li>
        <li>
          <a href="https://wpa.qq.com/msgrd?v=3&amp;uin=3360400800&amp;site=qq&amp;menu=yes" target="_blank" rel="noopener" aria-label="QQ" title="QQ：3360400800">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5c0 4.14-3.8 7.5-8.5 7.5-1 0-1.96-.15-2.84-.43L5 20l1.1-3.1A7.1 7.1 0 0 1 3.5 11.5C3.5 7.36 7.3 4 12 4s8.5 3.36 8.5 7.5z"/><circle cx="9.4" cy="11.2" r=".9" fill="currentColor" stroke="none"/><circle cx="14.6" cy="11.2" r=".9" fill="currentColor" stroke="none"/></svg>
          </a>
        </li>
        <li>
          <button class="social-btn" id="copyEmail" type="button"
                  data-copy="3360400800@qq.com"
                  aria-label="复制邮箱 3360400800@qq.com" title="点击复制邮箱">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
          </button>
        </li>
      </ul>
    </section>

    <section class="panels" id="panels">

      <article class="card quote" id="quoteCard" role="button" tabindex="0"
               aria-label="一言，点击换下一句" title="点击换一句">
        <span class="quote-glyph" aria-hidden="true">“</span>
        <p class="quote-text" id="quoteText">加载中…</p>
        <p class="quote-from" id="quoteFrom"></p>
      </article>

      <article class="card clock-card" id="clockCard" role="button" tabindex="0"
               aria-expanded="false" aria-controls="progress"
               aria-label="时间，点击查看今年进度" title="点击查看时间进度">
        <p class="date" id="date">—</p>
        <p class="clock" id="clock">--:--:--</p>
        <p class="weather" id="weather"></p>
      </article>

      <!-- 点击头像后覆盖在右侧控件上的简介 -->
      <div class="note" id="note" role="region" aria-label="简介">
        <p class="note-title">你好  我是 ChistXiao</p>
        <p class="note-body">一个喜欢折腾的人</p>
        <p class="note-body">如果你能看见这个  那我们大概已经认识<br>这里是我的blog主页  目前是一个简单的展示页<br>欢迎通过头像下面的方式找到我</p>
        <p class="note-ps">ps:联系不到也很正常  平时大多数时间在QQ水群...</p>
        <p class="note-hint">点击空白处关闭</p>
      </div>

      <!-- 点击名字后覆盖在右侧控件上的时间进度 -->
      <div class="progress" id="progress" role="region" aria-label="时间进度">
        <div class="prog-row" id="rowDay">
          <div class="prog-head"><span class="prog-title">今日已度过 <b>0</b> 小时</span><span class="prog-rest">剩余 24 小时</span></div>
          <div class="prog-bar"><span class="prog-fill"></span><span class="prog-label">0%</span></div>
        </div>
        <div class="prog-row" id="rowWeek">
          <div class="prog-head"><span class="prog-title">本周已度过 <b>0</b> 天</span><span class="prog-rest">剩余 7 天</span></div>
          <div class="prog-bar"><span class="prog-fill"></span><span class="prog-label">0%</span></div>
        </div>
        <div class="prog-row" id="rowMonth">
          <div class="prog-head"><span class="prog-title">本月已度过 <b>0</b> 天</span><span class="prog-rest">剩余 30 天</span></div>
          <div class="prog-bar"><span class="prog-fill"></span><span class="prog-label">0%</span></div>
        </div>
        <div class="prog-row" id="rowYear">
          <div class="prog-head"><span class="prog-title">本年已度过 <b>0</b> 天</span><span class="prog-rest">剩余 365 天</span></div>
          <div class="prog-bar"><span class="prog-fill"></span><span class="prog-label">0%</span></div>
        </div>
        <p class="note-hint">点击空白处关闭</p>
      </div>

    </section>
  </main>

  <footer class="foot">© 2026 ChistXiao</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/home/landing.js" defer></script>
</body>
</html>
