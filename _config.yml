# 站点
title: ChistXiao
description: ChistXiao 的个人主页
author: ChistXiao
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://chistxiao.github.io
root: /
permalink: :year/:month/:day/:title/

# 目录
source_dir: source
public_dir: public
skip_render:
  - index.html

# 写作（保留默认值，页面不再使用）
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
